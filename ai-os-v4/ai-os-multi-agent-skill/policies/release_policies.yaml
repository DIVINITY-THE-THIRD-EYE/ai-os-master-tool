release_policies:
  policy_id: REL-POLICY-001
  version: "1.0.0"
  scope: all_release_and_deployment_operations
  enforcement_level: blocking
  description: "Release and deployment governance policies"

  rules:
    REL-001:
      rule: "No production release without documented and tested rollback plan"
      enforcement: Block production deployment without rollback plan
      escalation_on_violation: Sev-1 to A10 and A00
    REL-002:
      rule: "No production deployment without explicit human approval for HIGH and CRITICAL risk releases"
      enforcement: Block high/critical risk release without approval record
      escalation_on_violation: Sev-1 to A13 and A00
    REL-003:
      rule: "All releases must pass all Quality Gates before deployment"
      enforcement: Block release if any gate failed
      escalation_on_violation: Sev-2 to A10
    REL-004:
      rule: "All deployments must include health checks and post-deployment validation"
      enforcement: Block deployment without health check definition
      escalation_on_violation: Sev-2 to A10
    REL-005:
      rule: "All releases must be versioned and release notes must be complete"
      enforcement: Block release without version ID and release notes
      escalation_on_violation: Sev-3 to A10
    REL-006:
      rule: "Monitoring and alerting must be active before production deployment"
      enforcement: Block production deployment if monitoring inactive
      escalation_on_violation: Sev-2 to A11
    REL-007:
      rule: "Automatic rollback must trigger if health checks fail post-deployment"
      enforcement: Automated rollback initiation on health check failure
      escalation_on_violation: Sev-1 if rollback also fails
    REL-008:
      rule: "All releases must be audited and logged in the Audit Trail"
      enforcement: Block release completion without audit record
      escalation_on_violation: Sev-3 to A09
