[project]
name = "ai-os-master-tool"
version = "4.0.0"
description = "Multi-Agent AI OS Context & Prompt Engineering Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.6.0",
    "pytest>=8.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "__pycache__",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^venv/",
    "^_",
    "test_"
]
